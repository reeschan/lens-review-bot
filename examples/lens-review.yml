# 対象リポジトリの .github/lens-review.yml に置く設定ファイルの例 (任意)
# 置かなければ既定値で動く。PR の base ブランチの版が読まれる。
# 書式は YAML の部分集合 (最上位の key: value のみ。入れ子やタブ字下げは不可)。

# レビューに使うモデル (空でない文字列、空白不可)
model: claude-sonnet-5-5

# Claude の最大ターン数 (1 以上 500 以下の整数)
max_turns: 80

# PR に出す重大度の下限 (critical / major / minor)
min_severity: major

# 規約 (CLAUDE.md・AGENTS.md・rules) に反する指摘を重大度に関係なく出すか (true / false)
post_rule_violations: true

# 追加の規約ファイル (リポジトリからの相対パスの一覧)
rules: []
# rules:
#   - docs/rules/review.md
#   - docs/conventions.md

# 仕様ファイル (リポジトリからの相対パス。既定はなし)
# spec: docs/spec.md

# レビュー対象から除くパス (glob の一覧)
exclude: []
# exclude:
#   - "*.lock"
#   - dist/**

# 既定で許す操作に追加するツール (既定ではコードやテストを実行しない)
allowed_tools: []
# allowed_tools:
#   - "Bash(python -m unittest:*)"
